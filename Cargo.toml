[workspace]
resolver = "3"
members = ["local-client", "cli"]

[package]
name = "aegis-tui"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
publish = false
description = "Composable read-only terminal presentation for Aegis authority state"

[dependencies]
aegis-client = { version = "=0.1.0", path = "../aegis/crates/aegis-client" }
aegis-admin-command = { version = "=0.1.0", path = "../aegis/crates/aegis-admin-command" }
aegis-protocol = { version = "=0.1.0", path = "../aegis/crates/aegis-protocol" }
ratatui = { version = "=0.30.2", default-features = false }
crossterm = "=0.29.0"

[lints.rust]
unsafe_code = "forbid"
[lints.clippy]
all = "warn"

