[package]
name = "aegis-tui-cli"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
publish = false

[[bin]]
name = "aegis-tui"
path = "src/main.rs"
doc = false

[dependencies]
aegis-tui = { path = ".." }
aegis-tui-local-client = { path = "../local-client" }
aegis-client = { version = "=0.1.0", path = "../../aegis/crates/aegis-client" }
aegis-protocol = { version = "=0.1.0", path = "../../aegis/crates/aegis-protocol" }
aegis-wire = { version = "=0.1.0", path = "../../aegis/crates/aegis-wire" }
ratatui = { version = "=0.30.2", default-features = false, features = ["crossterm"] }
crossterm = "=0.29.0"
serde_json = "=1.0.151"

[dev-dependencies]
aegis-authority = { version = "=0.0.1", path = "../../aegis" }
aegis-local = { version = "=0.0.1", path = "../../aegis/adapters/aegis-local" }
aegis-service = { version = "=0.1.0", path = "../../aegis/crates/aegis-service" }
aegis-local-daemon = { version = "=0.1.0", path = "../../aegis/crates/aegis-local-daemon" }

[lints.rust]
unsafe_code = "forbid"
[lints.clippy]
all = "warn"

