[package]
name = "aegis-admin-command"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
publish = false
description = "Exact-confirmation guards for Aegis administrative commands"

[dependencies]
aegis-client = { version = "=0.1.0", path = "../../aegis/crates/aegis-client" }
aegis-protocol = { version = "=0.1.0", path = "../../aegis/crates/aegis-protocol" }

[lints.rust]
unsafe_code = "forbid"
[lints.clippy]
all = "warn"
